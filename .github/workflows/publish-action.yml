# This workflow will build, test, and package a .NET desktop application
# and publish installable artifacts to GitHub Releases on pushes to main.

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    permissions:
      contents: write

    env:
      Solution_Name: DAVE.slnx
      Project_Path: DAVE.UI.csproj
      Runtime_Identifier: win-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

#    - name: Execute unit tests
#      run: dotnet test

    - name: Restore the application
      run: dotnet restore $env:Solution_Name

    - name: Publish the application
      run: dotnet publish $env:Project_Path -c $env:Configuration -r $env:Runtime_Identifier --self-contained true -p:PublishSingleFile=true -o $env:Publish_Dir
      env:
        Configuration: ${{ matrix.configuration }}
        Publish_Dir: artifacts/publish

    - name: Package the application
      shell: pwsh
      run: |
        $zipName = "DAVE-${{ matrix.configuration }}-${{ github.run_number }}-$env:Runtime_Identifier.zip"
        $zipPath = Join-Path "artifacts" $zipName
        Compress-Archive -Path "$env:Publish_Dir/*" -DestinationPath $zipPath
      env:
        Publish_Dir: artifacts/publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DAVE-${{ matrix.configuration }}-${{ github.run_number }}-${{ env.Runtime_Identifier }}
        path: artifacts/DAVE-${{ matrix.configuration }}-${{ github.run_number }}-${{ env.Runtime_Identifier }}.zip

    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.configuration == 'Release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.${{ github.run_number }}
        name: DAVE v0.1.${{ github.run_number }}
        generate_release_notes: true
        files: artifacts/DAVE-Release-${{ github.run_number }}-${{ env.Runtime_Identifier }}.zip
