# This workflow runs the unit test suite in isolation and publishes a
# detailed pass/fail report as a GitHub check, independent of the
# build/test/publish pipeline.

name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:

    runs-on: windows-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      Solution_Name: DAVE.slnx

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Run unit tests
      run: dotnet test $env:Solution_Name --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/*.trx
